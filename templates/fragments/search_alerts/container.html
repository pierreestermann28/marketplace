<div id="search-alerts-list" hx-target="this" hx-swap="outerHTML">
  <div class="space-y-3 text-sm text-ink-600">
    {% if search_alerts %}
      {% for alert in search_alerts %}
        <div class="relative rounded-2xl border border-ink-100 bg-ink-50 p-3">
          <button type="button"
                  class="search-alert-remove absolute right-3 top-3"
                  aria-label="Supprimer l’alerte"
                  hx-delete="{% url 'search_alert_delete' alert.id %}"
                  hx-target="#search-alerts-list"
                  hx-swap="outerHTML">
            <i data-lucide="x"></i>
          </button>
          <div class="flex items-center justify-between gap-3">
            <span>{{ alert }}</span>
            <span class="text-xs text-ink-500">{{ alert.last_sent|default:alert.created_at|date:"d M Y" }}</span>
          </div>
          <p class="text-xs text-ink-500 mt-1">Dernier email : {{ alert.last_sent|default:"Jamais" }}</p>
        </div>
      {% endfor %}
    {% else %}
      <p>Pas encore d'alertes.</p>
    {% endif %}
  </div>
</div>
